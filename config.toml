[output]
# waveform = "output/output.wav"
waveform = "output/out.ogg"
message = "output/out.txt"

[input]
message = "input/message.txt"

[audio]
sample_rate = 44100
frequency = 200
cycles_per_symbol = 2
volume = 0.2

[sync]
preamble = [0, 0, 0, 1, 1, 0, 1] # Barker sequence [1, 1, 1, -1, -1, 1, -1]

[debug]
out_txt = true